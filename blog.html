<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/FlowLogic.png">
    <title>Blog | Flowlogic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Ambient Slow Blue Floating Background Orbs -->
    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-orb ambient-orb-2"></div>
        <div class="ambient-orb ambient-orb-3"></div>
    </div>

    <!-- Header -->
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Flowlogic.</a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">Home</a></li>
                <li><a href="services.html" data-i18n="nav.services">Services</a></li>
                <li><a href="projects.html" data-i18n="nav.projects">Projects</a></li>
                <li><a href="skills.html" data-i18n="nav.skills">Skills</a></li>
                <li><a href="blog.html" class="active" data-i18n="nav.blog">Blog</a></li>
                <li><a href="contact.html" data-i18n="nav.contact">Contact</a></li>
            </ul>
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="de">DE</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <div class="hamburger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <!-- Blog Section -->
    <section id="blog" class="blog" style="padding-top: 140px;">
        <div class="container">
            <div class="section-header-editorial">
                <div class="editorial-meta">
                    <span class="editorial-counter">05</span>
                    <span class="editorial-category">Journal / Insights & Articles</span>
                    <span class="editorial-year">2025</span>
                </div>
                <h2 class="section-title" data-i18n="blog.title">Blog & Insights</h2>
                <p class="section-subtitle-editorial" data-i18n="blog.intro">
                    Einblicke, Tipps und Neuigkeiten rund um Salesforce und Prozessoptimierung.
                </p>
            </div>

            <!-- Blog Grid Container -->
            <div id="blog-grid" class="blog-grid">
                <noscript>
                    <p style="text-align:center; color: var(--text-secondary);">Bitte aktivieren Sie JavaScript, um den Blog zu sehen.</p>
                </noscript>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p data-i18n="footer.text">&copy; 2025 Flowlogic Consulting • Salesforce für dein Service-Team</p>
        </div>
    </footer>

    <button type="button" class="back-to-top" aria-label="Zurück zum Seitenanfang" title="Zurück zum Seitenanfang">
        <span aria-hidden="true">↑</span>
    </button>

    <script src="script.js"></script>
    <script src="blog-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadBlogList('blog-grid');
        });
    </script>
</body>

</html>
